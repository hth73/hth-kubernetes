cluster:
  name: kubernetes

devices:
  - enp0s8

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: 10.100.0.0/16

k8sServiceHost: 192.168.56.10
k8sServicePort: 6443

kubeProxyReplacement: true

operator:
  replicas: 1

routingMode: tunnel
tunnelProtocol: vxlan

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
