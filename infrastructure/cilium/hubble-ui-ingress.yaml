apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    cert-manager.io/clusterissuer: htdom-sub-ca

spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hubble.htdom.lan
      secretName: hubble-pki-secret
  rules:
    - host: hubble.htdom.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
