apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app: argocd
  annotations:
    cert-manager.io/clusterissuer: htdom-sub-ca
    
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - argo.htdom.lan
    secretName: argo-pki-secret
  rules:
  - host: argo.htdom.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              name: http
