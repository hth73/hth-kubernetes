apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app: argocd

spec:
  dnsNames:
    - argo.htdom.lan
  commonName: argo.htdom.lan
  secretName: argo-pki-secret
  duration: 2160h
  renewBefore: 360h

  usages:
    - server auth

  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8 
    rotationPolicy: Always

  subject:
    organizations:
      - "HTDOM Inc."
    organizationalUnits:
      - "Kubernetes"
    countries:
      - "DE"
    localities:
      - "Munich"

  issuerRef:
    name: htdom-sub-ca
    kind: ClusterIssuer
    group: cert-manager.io
