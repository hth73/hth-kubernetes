---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: forgejo-postgres-pv-worker1
  labels:
    app.kubernetes.io/name: forgejo-postgres
    app: forgejo
    environment: dev

spec:
  capacity:
    storage: 15Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/lib/k8s-storage/postgres/forgejo/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - coreos-worker1
