apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: petclinic
  namespace: petclinic
  labels:
    app.kubernetes.io/name: petclinic
    app: petclinic
    environment: dev

spec:
  serviceName: petclinic

  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic

  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: petclinic
        app: petclinic
        environment: dev

    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"

#      initContainers:
#        - name: wait-for-postgresql
#          image: busybox:1.36
#          command:
#            - sh
#            - -c
#            - |
#              echo "Waiting for PostgreSQL..."
#              until nc -z forgejo-postgres-rw.postgresql.svc.cluster.local 5432; do
#                echo "PostgreSQL is not available yet..."
#                sleep 2
#              done
#              echo "PostgreSQL is available!"

      containers:
        - name: petclinic
          # JVM-Image, lokal gebaut und per ctr auf die Worker importiert
          image: docker.io/hth73/spring-petclinic:3.5.6-jvm
          # nie aus einer Registry ziehen, nur das importierte Image verwenden
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 768Mi
          # JVM mit Java-Agent braucht beim Start deutlich länger
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
