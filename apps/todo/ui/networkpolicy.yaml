apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-ui-network-policy
  namespace: todo
  labels:
    app.kubernetes.io/name: todo-ui
    app.kubernetes.io/component: ui
    app: todo
    environment: dev

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: todo-ui
      app.kubernetes.io/component: ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from Traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS queries to CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
