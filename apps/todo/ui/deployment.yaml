apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-ui
  namespace: todo
  labels:
    app.kubernetes.io/name: todo-ui
    app.kubernetes.io/component: ui
    app: todo
    environment: dev

spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-ui
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-ui
        app.kubernetes.io/component: ui
        app: todo
        environment: dev

    spec:
      serviceAccountName: todo-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      nodeSelector:
        node-role.kubernetes.io/worker: "true"
        
      containers:
        - name: todo-ui-container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: docker.io/hellemon/docker-repo:todo-frontend-0.1.4
          imagePullPolicy: IfNotPresent
          env:
            - name: REACT_APP_BACKEND_BASE_URI
              value: "/api/items/"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
