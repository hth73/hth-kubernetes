apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - db/persistent-volume.yaml
  - db/persistent-volume-claim.yaml
  - db/statefulset.yaml
  - db/service.yaml
  - app/deployment.yaml
  - app/service.yaml
  - ui/deployment.yaml
  - ui/service.yaml
  - ui/ingress.yaml
  - ui/networkpolicy.yaml
  - ui/serviceaccount.yaml
  - ../templates/namespace/namespace.yaml
  - ../templates/certificate/certificate.yaml
  - ../templates/pdb/pdb.yaml

patches:
  - target:
      version: v1
      kind: Namespace
      name: app-ns
    patch: |-
      - op: replace
        path: /metadata/name
        value: todo
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: todo-ui
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1component
        value: ui
      - op: replace
        path: /metadata/labels/app
        value: todo

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: app-pdb
    patch: |-
      - op: replace
        path: /metadata/name
        value: todo-ui
      - op: replace
        path: /metadata/namespace
        value: todo
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: todo-ui
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1component
        value: ui
      - op: replace
        path: /metadata/labels/app
        value: todo
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: todo-ui
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1component
        value: ui

  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: servername.htdom.lan
    patch: |-
      - op: replace
        path: /metadata/name
        value: todo-server-certificate
      - op: replace
        path: /metadata/namespace
        value: todo
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: todo
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1component
        value: ui
      - op: replace
        path: /metadata/labels/app
        value: todo
      - op: replace
        path: /spec/dnsNames/0
        value: todo.htdom.lan
      - op: replace
        path: /spec/commonName
        value: todo.htdom.lan
      - op: replace
        path: /spec/secretName
        value: todo-pki-secret
