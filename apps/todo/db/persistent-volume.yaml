apiVersion: v1
kind: PersistentVolume
metadata:
  name: todo-pv-worker1
  labels:
    app.kubernetes.io/name: todo-db
    app.kubernetes.io/component: db
    app: todo
    environment: dev

spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/lib/k8s-storage/postgres/todo/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - coreos-worker1
