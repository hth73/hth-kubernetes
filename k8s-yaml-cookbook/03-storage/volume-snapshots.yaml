# Requires the CSI snapshot controller and a compatible CSI driver.
# VolumeSnapshotClass is cluster-scoped; VolumeSnapshot is namespaced.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: <snapshot-class>
driver: <csi-driver.example.com>
deletionPolicy: Retain
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: <snapshot-name>
  namespace: <namespace>
spec:
  volumeSnapshotClassName: <snapshot-class>
  source:
    persistentVolumeClaimName: <pvc-name>
