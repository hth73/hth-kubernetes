# Usually controller-managed from a Service selector; rarely create manually.
# This example shows the shape only. Use real, routable endpoint addresses.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: <slice-name>
  namespace: <namespace>
  labels:
    kubernetes.io/service-name: <service-name>
    endpointslice.kubernetes.io/managed-by: <manager-name>
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      - "192.0.2.10"
    conditions:
      ready: true
