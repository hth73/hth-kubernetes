---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: htdom-sub-ca
  namespace: cert-manager
spec:
  commonName: "htdom-sub-ca"
  secretName: "htdom-sub-ca-secret"
  isCA: true
  duration: 26280h # 3 Jahre
  renewBefore: 720h # 30 Tage vor Ablauf erneuern
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - cert sign
  subject:
    organizations:
      - "HTDOM Inc." # (O) Organization
    organizationalUnits:
      - "IT" # (OU) Organizational unit
    countries:
      - "DE" # (C) Country
    localities:
      - "Muenchen" # (L) Location
    provinces:
      - "Bayern" # (ST) Province
  issuerRef:
    name: htdom-root-ca
    kind: ClusterIssuer
